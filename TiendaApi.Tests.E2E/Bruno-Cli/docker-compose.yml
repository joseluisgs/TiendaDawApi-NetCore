services:
  bruno:
    # Imagen oficial de Bruno CLI (Docker Verified Publisher).
    # Entrypoint ya es `bru` y el working dir esperado es /bruno.
    image: usebruno/cli:latest
    container_name: tienda-api-bruno-tests
    volumes:
      - .:/bruno:ro
      - ./reports:/reports
    command:
      - run
      - "."
      - --env-file
      - environments/local.bru
      # Rate limit de la API (RateLimitConfig.cs): POST:* 20/min.
      # Sin este delay la colección (64 requests) recibe 429 en cadena.
      - --delay
      - "3200"
      - --reporter-json
      - /reports/report.json
      - --reporter-junit
      - /reports/junit-report.xml
      - --reporter-html
      - /reports/report.html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Si la API aún no está arriba, reintenta (máx 3) en vez de morir.
    restart: on-failure:3

networks:
  default:
    name: tienda-api-network
